<div class="dashboard-container">
    <h1>{{ title }}</h1>
    <div class="sales-summary">
      <div class="sales-card" *ngFor="let sale of salesData">
        <h2>{{ sale.category }}</h2>
        <p>${{ sale.amount }}</p>
      </div>
    </div>
    <button class="action-button">New Sale</button>
  </div>
