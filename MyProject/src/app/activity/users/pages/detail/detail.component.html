<div *ngIf="user" class="container">
    <div class="profile">
        <h2>User's Profile</h2>
        <img [src]="user.imgUrl" alt="Profile Image">
        <h2>{{user.name}}</h2>
        <div class="info">
            <p>Gender: {{user.gender}}</p>
            <p>Age: {{user.age}}</p>
            <p>Date of Birth: {{user.bday}}</p>
            <p>Address: {{user.address}}</p>
        </div>
    </div>
</div>
