<div class="container">
    <div class="form-container">
        <h3>Login To Your Account</h3>
        <p class="error" *ngIf="loginError">{{loginError}}</p>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field>
            <mat-label>Enter your email</mat-label>
            <input
              type="email"
              matInput
              placeholder="example@email.com"
              formControlName="username"
              required
            />
              <mat-error *ngIf="username?.hasError('required')">Username is required</mat-error>
              <mat-error *ngIf="username?.hasError('email')">Must be an email</mat-error>
          </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input
              type="password"
              matInput
              formControlName="password"
              required
            />
              <mat-error *ngIf="password?.hasError('required')">Password is required</mat-error>
          </mat-form-field>
          <button type="submit" mat-raised-button>Login</button>
        </form>
    </div>
</div>
